name: Build Windows preview
on:
  workflow_dispatch:
    inputs:
      sign_windows:
        description: 'Assinar Authenticode (exige certificado configurado nos secrets)'
        type: boolean
        default: false
      sign_manifest:
        description: 'Gerar manifesto Ed25519 (exige chave privada original nos secrets)'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm.cmd ci
      - run: python -m venv .venv
      - run: .\.venv\Scripts\python.exe -m pip install -r requirements-lock.txt
      - run: npm.cmd test
      - if: ${{ !inputs.sign_windows }}
        run: npm.cmd run dist
      - if: ${{ inputs.sign_windows }}
        run: npm.cmd run dist:signed
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      - if: ${{ inputs.sign_manifest }}
        run: npm.cmd run release:manifest
        env:
          ALT_UPDATE_PRIVATE_KEY: ${{ secrets.ALT_UPDATE_PRIVATE_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: ALT-AI-Windows-x64
          path: |
            release/ALT-AI-Setup-*.exe
            release/ALT-AI-*-update.json
            release/SHA256SUMS.txt
